        // 全局变量
        var isMobileMode = false;
        var currentHour = 0;
        
        // 主初始化函数
        function init() {
            // 1. 根据页面宽度判断设备类型（只在首次加载时判断）
            detectDeviceType();
            
            // 2. 获取当前时间
            updateCurrentTime();
            
            // 3. 渲染频道
            renderChannels();
            
            // 4. 每分钟检查一次时间，更新频道状态
            setInterval(function() {
                updateCurrentTime();
                updateChannelStatus();
            }, 60000); // 每分钟更新一次
        }
        
        // 检测设备类型
        function detectDeviceType() {
            var width = window.innerWidth || document.documentElement.clientWidth;
            // 首次打开页面时判断，宽度小于768px为手机
            isMobileMode = width < 768;
            
            // 添加对应的CSS类名
            if (isMobileMode) {
                document.body.className = 'mobile-mode';
            } else {
                document.body.className = '';
            }
            
            console.log("设备模式: " + (isMobileMode ? "手机" : "电脑"));
        }
        
        // 更新当前时间
        function updateCurrentTime() {
            var now = new Date();
            currentHour = now.getHours();
        }
        
        // 检查时间段是否匹配
        function isInTimeRange(timeRange) {
            if (!timeRange || timeRange === "0-24点") {
                return true; // 全天显示
            }
            
            var timeSegments = timeRange.split(',');
            
            for (var i = 0; i < timeSegments.length; i++) {
                var segment = timeSegments[i].trim();
                if (segment.indexOf('-') > -1) {
                    var times = segment.split('-');
                    var start = parseInt(times[0]);
                    var end = parseInt(times[1].replace('点', ''));
                    
                    // 处理跨天时段
                    if (start <= end) {
                        // 正常时段，如1-6点
                        if (currentHour >= start && currentHour < end) {
                            return true;
                        }
                    } else {
                        // 跨天时段，如17-1点
                        if (currentHour >= start || currentHour < end) {
                            return true;
                        }
                    }
                }
            }
            
            return false;
        }
        
        // 检查设备是否匹配
        function isDeviceMatched(device) {
            if (device === "电脑和手机") {
                return true;
            }
            
            if (isMobileMode && device === "手机") {
                return true;
            }
            
            if (!isMobileMode && device === "电脑") {
                return true;
            }
            
            return false;
        }
        
        // 渲染频道
        function renderChannels() {
            var container = document.getElementById('channelsContainer');
            container.innerHTML = '';
            
            var visibleChannels = 0;
            
            for (var i = 0; i < channelsData.length; i++) {
                var channel = channelsData[i];
                var isTimeMatch = isInTimeRange(channel.timeRange);
                var isDeviceMatch = isDeviceMatched(channel.device);
                
                // 创建频道元素
                var channelElement = document.createElement('div');
                channelElement.className = 'channel-item';
                channelElement.id = 'channel-' + channel.id;
                
                // 如果时间和设备都匹配，频道可显示
                if (isTimeMatch && isDeviceMatch) {
                    visibleChannels++;
                    
                    // 创建链接
                    if (channel.link && channel.link !== '0' && channel.link !== '1/' && channel.link !== '2/' && channel.link !== '3/' && channel.link !== '5' && channel.link !== '6/' && channel.link !== '7') {
                        channelElement.onclick = function(link) {
                            return function() {
                                window.open(link, '_blank');
                            };
                        }(channel.link);
                        channelElement.style.cursor = 'pointer';
                        channelElement.title = '点击观看 ' + channel.channel + ' ' + channel.name;
                    } else {
                        channelElement.className += ' disabled';
                        channelElement.title = '暂无直播链接';
                    }
                    
                    // 填充内容
                    channelElement.innerHTML = 
                        '<div class="channel-name">' + channel.channel + '</div>' +
                        '<div class="channel-title">' + channel.name + '</div>';
                } else {
                    // 不满足显示条件，隐藏频道
                    channelElement.className += ' hidden';
                }
                
                container.appendChild(channelElement);
            }
            
            // 如果没有可显示的频道
            if (visibleChannels === 0) {
                var noChannelElement = document.createElement('div');
                noChannelElement.className = 'no-channels';
                noChannelElement.innerHTML = '<p>当前时段暂无可用频道</p>';
                container.appendChild(noChannelElement);
            }
        }
        
        // 更新频道状态
        function updateChannelStatus() {
            for (var i = 0; i < channelsData.length; i++) {
                var channel = channelsData[i];
                var element = document.getElementById('channel-' + channel.id);
                
                if (element) {
                    var isTimeMatch = isInTimeRange(channel.timeRange);
                    var isDeviceMatch = isDeviceMatched(channel.device);
                    
                    if (isTimeMatch && isDeviceMatch) {
                        // 显示频道
                        element.className = element.className.replace(' hidden', '');
                        
                        // 设置可点击状态
                        if (channel.link && channel.link !== '0' && channel.link !== '1/' && channel.link !== '2/' && channel.link !== '3/' && channel.link !== '5' && channel.link !== '6/' && channel.link !== '7') {
                            element.className = element.className.replace(' disabled', '');
                            element.style.cursor = 'pointer';
                            element.onclick = function(link) {
                                return function() {
                                    window.open(link, '_blank');
                                };
                            }(channel.link);
                        } else {
                            if (element.className.indexOf('disabled') === -1) {
                                element.className += ' disabled';
                            }
                            element.style.cursor = 'default';
                            element.onclick = null;
                        }
                    } else {
                        // 隐藏频道
                        if (element.className.indexOf('hidden') === -1) {
                            element.className += ' hidden';
                        }
                    }
                }
            }
            
            // 检查是否还有可见频道
            var visibleChannels = document.querySelectorAll('.channel-item:not(.hidden)').length;
            var noChannelElement = document.querySelector('.no-channels');
            
            if (visibleChannels === 0 && !noChannelElement) {
                var container = document.getElementById('channelsContainer');
                noChannelElement = document.createElement('div');
                noChannelElement.className = 'no-channels';
                noChannelElement.innerHTML = '<p>当前时段暂无可用频道</p>';
                container.appendChild(noChannelElement);
            } else if (visibleChannels > 0 && noChannelElement) {
                noChannelElement.remove();
            }
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
        
        // 添加IE11兼容的classList.replace方法
        if (!("classList" in document.documentElement) || 
            !document.documentElement.classList.replace) {
            DOMTokenList.prototype.replace = function(oldToken, newToken) {
                if (this.contains(oldToken)) {
                    this.remove(oldToken);
                    this.add(newToken);
                }
            };
        }
    </script>
