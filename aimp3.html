<style>
  /* ========== 基础重置 ========== */
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg-0: #000000;
    --bg-1: #12121a;
    --bg-2: #1a1a26;
    --bg-3: #22223a;
    --accent: #7c5cff;
    --accent-2: #00d4ff;
    --accent-glow: rgba(124, 92, 255, .35);
    --text-1: #f0f0f5;
    --text-2: #a0a0b8;
    --text-3: #6a6a82;
    --radius: 50px;
    --transition: .3s cubic-bezier(.4,0,.2,1);
  }

  html {
    scroll-behavior: smooth;
    /* 第一层防横向滚动 */
    overflow-x: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg-0);
    color: var(--text-1);
    min-height: 100vh;
    /* 第二层强制禁止横向滚动，双保险 */
    overflow-x: hidden !important;
    line-height: 1.6;
  }

  /* ========== 全局禁止文字选中（搜索框除外） ========== */
  body, body * {
    user-select: none;
    -webkit-user-select: none;
  }
  .search-wrap .search-box input,
  .search-wrap .search-box input::placeholder {
    user-select: text !important;
    -webkit-user-select: text !important;
  }
  .bg-orbs {
    display: none;
  }

  /* 统一安全内边距容器，代替各个标签分散padding，防止溢出累积 */
  .safe-padding {
    padding-inline: 16px;
  }

  /* ========== 头部 ========== */
  .header {
    text-align: center;
    padding: 12px 0 8px;
    margin-top: 0;
  }
  .header h1 {
    font-size: clamp(1rem, 2.8vw, 1.4rem);
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ========== 搜索框 ========== */
  .search-wrap {
    max-width: 560px;
    margin: 4px auto 20px;
  }
  .search-box {
    position: relative;
    display: flex;
    align-items: center;
    background: var(--bg-2);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: var(--radius);
    padding: 12px 22px;
    transition: var(--transition);
  }
  .search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
  }
  .search-box svg { flex-shrink: 0; opacity: .6; }
  .search-box input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text-1);
    font-size: 1rem;
    padding-right: 80px;
  }
  .search-box input::placeholder { color: var(--text-3); }

  /* 搜索按钮字体21px */
  .search-box button {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 74px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border: none;
    border-radius: 0 var(--radius) var(--radius) 0;
    font-size: 21px;
    font-weight: 600;
    cursor: pointer;
    transition: none;
  }
  .search-box button:hover {
    transform: none;
    box-shadow: none;
  }

  /* ========== 歌单区域标题栏 ========== */
  .section-title {
    max-width: 1400px;
    margin: 40px auto 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  /* 点击区域：三角+歌单文字 鼠标手型 */
  .title-click-area{
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
  }
  .section-title .icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(1rem, 2vw, 1.1rem);
    color:#ffffff;
  }
  .section-title h2 {
    font-size: clamp(1rem, 2vw, 1.3rem);
    font-weight: 700;
  }

  /* ========== 随机歌手按钮 ========== */
  .random-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: clamp(1rem, 2vw, 1.3rem);
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: 20px;
    padding: 5px 14px;
    margin-left: 10px;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
  }
  .random-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 15px var(--accent-glow);
  }
  .random-btn.active {
    background: linear-gradient(135deg, #ff4757, #ff6b81);
    animation: randomPulse 1s ease-in-out infinite;
  }
  @keyframes randomPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,71,87,.4); }
    50%     { box-shadow: 0 0 0 8px rgba(255,71,87,0); }
  }
  .random-btn .btn-icon {
    font-size: clamp(1rem, 2vw, 1.1rem);
    transition: transform .3s;
    color:#fff;
  }
  .random-btn:hover .btn-icon { transform: rotate(180deg); }
  .random-btn.active .btn-icon { animation: spin .5s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ========== 倒计时弹窗【兼容老WebKit，删除inset】 ========== */
  .countdown-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .countdown-overlay.show { display: flex; }

  .countdown-wrap{
    width:100%;
    padding:0 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  .countdown-name {
    font-size: 50px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: namePop .3s ease;
    margin-bottom:16px;
    text-align:center;
  }
  @keyframes namePop {
    0%   { transform: scale(.5); opacity: 0; }
    100% { transform: scale(1);  opacity: 1; }
  }
  .countdown-num {
    font-size: 50px;
    font-weight: 900;
    color: #fff;
    line-height: 1;
    text-shadow: 0 0 30px var(--accent-glow);
    margin-bottom:16px;
    text-align:center;
  }
  .countdown-hint {
    font-size: .9rem;
    color: var(--text-3);
    text-align:center;
  }
  .countdown-hint kbd {
    background: var(--bg-3);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: .8rem;
    color: var(--text-2);
    margin: 0 2px;
  }

  /* ========== 歌单网格 ========== */
  .playlist-grid {
    max-width: 1400px;
    margin: 0 auto;
    padding-bottom: 20px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
  }

  .song-card {
    background: linear-gradient(145deg, var(--bg-2), var(--bg-1));
    border: 1px solid rgba(255,255,255,.05);
    border-radius: var(--radius);
    padding: 16px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: var(--transition);
    cursor: pointer;
    text-decoration: none;
    color: var(--text-1);
    position: relative;
    overflow: hidden;
  }
  .song-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    opacity: 0;
    transition: var(--transition);
    z-index: 0;
  }
  .song-card:hover {
    transform: translateY(-3px);
    border-color: rgba(124,92,255,.4);
    box-shadow: 0 12px 40px rgba(124,92,255,.15);
  }
  .song-card:hover::before { opacity: .06; }
  .song-card > * { position: relative; z-index: 1; }

  .song-num {
    flex-shrink: 0;
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--bg-3);
    display: flex; align-items: center; justify-content: center;
    font-size: .85rem;
    font-weight: 700;
    color: var(--text-2);
    transition: var(--transition);
  }
  .song-card:hover .song-num {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
  }
  .song-info { flex: 1; min-width: 0; }
  .song-info .title {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ========== 回到顶部按钮【兼容修复】 ========== */
  .back-top {
    position: fixed;
    /* 使用视口相对计算，老webkit更加稳定 */
    right: max(16px, 26px);
    bottom: 300px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    font-size: 22px;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transition: 0.3s ease;
    z-index: 99;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .back-top.show {
    opacity: 1;
    visibility: visible;
  }
  .back-top:hover {
    filter: brightness(1.15);
  }

  /* ========== 响应式 ========== */
  @media (max-width: 1024px) {
    .playlist-grid { grid-template-columns: repeat(4, 1fr); }
  }

  @media (max-width: 748px) {
    .playlist-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .song-card {
      padding: 14px 12px;
      gap: 12px;
    }
    .song-num { width: 30px; height: 30px; font-size: .78rem; }
    .song-info .title { font-size: 16px; }

    .back-top {
      width: 46px;
      height: 46px;
      right: 16px;
      bottom: 300px;
      font-size:20px;
    }
  }

  /* ========== 入场动画 ========== */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .song-card {
    animation: fadeUp .5s ease both;
  }

</style>
</head>

// 固定特殊条目
const SPECIAL_ITEM = {
  name: "群星组合"
};

// ======================================
// 【DOM缓存】页面元素一次性获取，提升性能
// ======================================
const el = {
  playlist: document.getElementById("playlist"),
  randomBtn: document.getElementById("randomBtn"),
  overlay: document.getElementById("countdownOverlay"),
  countdownName: document.getElementById("countdownName"),
  countdownNum: document.getElementById("countdownNum"),
  btnText: document.querySelector(".random-btn .btn-text"),
  btnIcon: document.querySelector(".random-btn .btn-icon"),
  backTop: document.getElementById("backTop"),
  searchForm: document.getElementById("searchForm"),
  searchInput: document.getElementById("searchInput"),
  scrollToBottomBtn: document.getElementById("scrollToBottomBtn"),
  pageBottomAnchor: document.getElementById("pageBottomAnchor")
};

// ======================================
// 【功能函数区】
// ======================================
/**
 * 渲染全部歌单卡片
 */
function renderPlaylist() {
  // 合并普通歌手 + 末尾追加群星组合
  const allList = [...artistNames, SPECIAL_ITEM.name];

  allList.forEach((name, index) => {
    const num = String(index + 1).padStart(2, "0");
    const card = document.createElement("a");
    card.className = "song-card";
    card.style.animationDelay = (index * 0.03) + "s";

    // 判断链接
    if (name === SPECIAL_ITEM.name) {
      card.href = BASE_URL;
    } else {
      card.href = SEARCH_PREFIX + encodeURIComponent(name);
    }
    card.target = "_blank";
    card.rel = "noopener";

    card.innerHTML = `
      <div class="song-num">${num}</div>
      <div class="song-info">
        <div class="title">${name}</div>
      </div>
    `;
    el.playlist.appendChild(card);
  });
}

/**
 * 随机挑选普通歌手（排除群星组合）
 */
function getRandomArtist() {
  const randomIndex = Math.floor(Math.random() * artistNames.length);
  return artistNames[randomIndex];
}

// 随机状态变量
let isRunning = false;
let timer = null;
let currentArtist = "";

/**
 * 切换随机歌手倒计时
 */
function toggleRandom() {
  if (!isRunning) {
    startRandom();
  } else {
    cancelRandom();
  }
}

/**
 * 启动随机倒计时
 */
function startRandom() {
  isRunning = true;
  el.randomBtn.classList.add("active");
  el.btnIcon.textContent = "⟳";
  el.btnText.textContent = "取消随机";

  currentArtist = getRandomArtist();
  el.countdownName.textContent = currentArtist;
  el.countdownNum.textContent = 3;
  el.overlay.classList.add("show");

  const startTime = Date.now();
  timer = setInterval(() => {
    const elapsed = Date.now() - startTime;
    const remaining = Math.ceil((3000 - elapsed) / 1000);

    currentArtist = getRandomArtist();
    el.countdownName.textContent = currentArtist;

    if (remaining > 0) {
      el.countdownNum.textContent = remaining;
    } else {
      el.countdownNum.textContent = "GO!";
    }

    if (elapsed >= 3000) {
      clearInterval(timer);
      finishRandom();
    }
  }, 100);
}

/**
 * 取消随机
 */
function cancelRandom() {
  clearInterval(timer);
  isRunning = false;
  el.randomBtn.classList.remove("active");
  el.btnIcon.textContent = "⟳";
  el.btnText.textContent = "随机歌手";
  el.overlay.classList.remove("show");
}

/**
 * 倒计时结束跳转
 */
function finishRandom() {
  isRunning = false;
  el.randomBtn.classList.remove("active");
  el.btnIcon.textContent = "⟳";
  el.btnText.textContent = "随机歌手";

  setTimeout(() => {
    el.overlay.classList.remove("show");
    if (currentArtist) {
      const url = SEARCH_PREFIX + encodeURIComponent(currentArtist);
      window.open(url, "_blank", "noopener");
    }
  }, 500);
}

/**
 * 搜索提交
 */
function handleSearch(e) {
  e.preventDefault();
  const kw = el.searchInput.value.trim();
  if (kw) {
    window.open(SEARCH_PREFIX + encodeURIComponent(kw), "_blank", "noopener");
  }
}

/**
 * 回到顶部显示控制
 */
function handleScroll() {
  el.backTop.classList.toggle("show", window.scrollY > 400);
}

function backToTop() {
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/**
 * 平滑滚动到页面底部锚点
 */
function scrollPageToBottom(){
  el.pageBottomAnchor.scrollIntoView({
    behavior:"smooth"
  });
}

// ======================================
// 【事件绑定 & 页面初始化入口】
// ======================================
function init() {
  // 渲染列表
  renderPlaylist();

  // 绑定事件
  el.randomBtn.addEventListener("click", toggleRandom);
  el.searchForm.addEventListener("submit", handleSearch);
  el.backTop.addEventListener("click", backToTop);
  el.overlay.addEventListener("click", () => isRunning && cancelRandom());
  // 绑定【三角+歌单】点击跳转底部
  el.scrollToBottomBtn.addEventListener("click",scrollPageToBottom);

  window.addEventListener("scroll", handleScroll);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && isRunning) cancelRandom();
  });
}

// 启动初始化
init();
</script>
</body>
</html>
